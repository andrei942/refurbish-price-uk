<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Refurbish Price UK</title>
  <link rel="stylesheet" href="style.css"> <!-- keep your old CSS -->
</head>
<body>
  <div class="container">
    <h1>Refurbish Price UK</h1>

    <!-- Room selection -->
    <label>Room:</label>
    <select id="roomName">
      <option value="Bedroom">Bedroom</option>
      <option value="Bathroom">Bathroom</option>
      <option value="Living Room">Living Room</option>
      <option value="Other">Other</option>
    </select>

    <input type="text" id="customRoomName" placeholder="Enter room name" style="display:none;">

    <!-- Room size -->
    <label>Room size (m²):</label>
    <input type="number" id="size" placeholder="Enter size">

    <!-- Wall type -->
    <label>Wall type:</label>
    <select id="wallType">
      <option value="Paint">Paint</option>
      <option value="Wallpaper">Wallpaper</option>
      <option value="Tile">Tile</option>
    </select>

    <!-- Flooring -->
    <label>Flooring:</label>
    <select id="flooring">
      <option value="Wood">Wood</option>
      <option value="Tile">Tile</option>
      <option value="Carpet">Carpet</option>
    </select>

    <!-- Optional items -->
    <label>Optional Items:</label>
    <input type="checkbox" class="optionalItem" data-name="Door" data-price="150"> Door (£150)
    <input type="checkbox" class="optionalItem" data-name="Window" data-price="200"> Window (£200)

    <!-- Stripe pay button -->
    <button id="checkout-button">Pay £10 to download PDF</button>
  </div>

  <!-- Stripe JS -->
  <script src="https://js.stripe.com/v3/"></script>
  <script src="script.js"></script>
</body>
</html>
