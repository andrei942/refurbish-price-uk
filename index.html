<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Refurbish Price UK | Full House Estimator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Refurbish Price UK - Estimate full house renovation costs including paint, wallpaper, flooring, doors, windows and more.">
<style>
  body { font-family: Arial, sans-serif; max-width: 750px; margin: 30px auto; padding: 10px; line-height: 1.5; }
  h1,h2 { color: #2c3e50; }
  form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  label { font-weight: bold; }
  select,input,button { padding: 8px; font-size: 16px; }
  button { background-color: #2980b9; color: white; border: none; cursor: pointer; }
  button:hover { background-color: #1c5980; }
  #total { font-size: 24px; color: #27ae60; font-weight: bold; }
</style>
</head>
<body>

<h1>Refurbish Price UK</h1>
<p>Estimate the refurbishment cost of your room in the UK.</p>
<p><strong>Disclaimer:</strong> Prices are estimates and may vary based on location, materials, and labour.</p>

<form id="estimateForm">
  <label for="room">Room Type:</label>
  <select id="room">
    <option value="bathroom">Bathroom</option>
    <option value="kitchen">Kitchen</option>
    <option value="bedroom">Bedroom</option>
    <option value="living">Living Room</option>
  </select>

  <label for="size">Room Size (m²):</label>
  <input type="number" id="size" value="10" min="1">

  <label for="quality">Quality Level:</label>
  <select id="quality">
    <option value="basic">Basic</option>
    <option value="mid">Mid</option>
    <option value="premium">Premium</option>
  </select>

  <label for="wall">Wall Covering:</label>
  <select id="wall" onchange="updateWallSubOptions()">
    <option value="paint">Paint</option>
    <option value="wallpaper">Wallpaper</option>
    <option value="tile">Tile</option>
  </select>

  <div id="wallSubDiv" style="display:none;">
    <label for="wallSub">Select Type:</label>
    <select id="wallSub"></select>
  </div>

  <label for="flooring">Flooring Type:</label>
  <select id="flooring">
    <option value="wood">Wood</option>
    <option value="laminate">Laminate</option>
    <option value="carpet">Carpet</option>
    <option value="tile">Tile</option>
    <option value="vinyl">Vinyl</option>
  </select>

  <label for="doors">Number of Doors:</label>
  <input type="number" id="doors" value="1" min="0">

  <label for="windows">Number of Windows:</label>
  <input type="number" id="windows" value="1" min="0">

  <button type="button" onclick="calculateEstimate()">Get Estimate</button>
  <button type="button" onclick="downloadPDF()">Download PDF</button>
</form>

<h2>Estimated Cost: £<span id="total">0</span></h2>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
  // UK prices per m² or per unit
  const paintPrices = { basic:10, mid:15, premium:25 };
  const wallpaperPrices = { plain:12, patterned:18, textured:25, premium:40 };
  const tilePrices = { ceramic:20, porcelain:35, mosaic:50, stone:60 };
  const flooringPrices = { wood:25, laminate:20, carpet:15, tile:30, vinyl:18 };
  const doorsPrices = { basic:50, mid:100, premium:250 };
  const windowsPrices = { basic:150, mid:250, premium:500 };

  let wallOptions = {
    wallpaper:["plain","patterned","textured","premium"],
    tile:["ceramic","porcelain","mosaic","stone"]
  };

  let currentEstimate = 0;
  let currentSelection = {};

  function updateWallSubOptions(){
    const wall = document.getElementById('wall').value;
    const subDiv = document.getElementById('wallSubDiv');
    const subSelect = document.getElementById('wallSub');
    subSelect.innerHTML = "";

    if(wall==="paint"){
      subDiv.style.display = "none";
    } else {
      subDiv.style.display = "block";
      wallOptions[wall].forEach(opt=>{
        const option = document.createElement("option");
        option.value = opt;
        option.text = opt.charAt(0).toUpperCase() + opt.slice(1);
        subSelect.appendChild(option);
      });
    }
  }

  function calculateEstimate() {
    const room = document.getElementById('room').value;
    const size = parseFloat(document.getElementById('size').value);
    const quality = document.getElementById('quality').value;
    const wall = document.getElementById('wall').value;
    const wallSub = document.getElementById('wallSub').value;
    const flooring = document.getElementById('flooring').value;
    const doors = parseInt(document.getElementById('doors').value);
    const windows = parseInt(document.getElementById('windows').value);

    if(isNaN(size) || size<=0){
      alert("Please enter a valid room size in m².");
      return;
    }

    let wallCost = 0;
    if(wall==="paint"){
      wallCost = paintPrices[quality]*size;
    } else if(wall==="wallpaper"){
      wallCost = wallpaperPrices[wallSub]*size;
    } else if(wall==="tile"){
      wallCost = tilePrices[wallSub]*size;
    }

    const flooringCost = flooringPrices[flooring]*size;
    const doorsCost = doors * doorsPrices[quality];
    const windowsCost = windows * windowsPrices[quality];

    const total = wallCost + flooringCost + doorsCost + windowsCost;

    currentEstimate = total;
    currentSelection = { room, size, quality, wall, wallSub, flooring, doors, windows, wallCost, flooringCost, doorsCost, windowsCost, total };

    document.getElementById('total').textContent = total.toLocaleString();
  }

  function downloadPDF() {
    if(currentEstimate===0){
      alert("Please calculate estimate first!");
      return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(18);
    doc.text("Refurbish Price UK", 20, 20);
    doc.setFontSize(12);
    doc.text("Estimated Renovation Report", 20, 30);
    doc.text(`Room Type: ${currentSelection.room}`, 20, 40);
    doc.text(`Room Size: ${currentSelection.size} m²`, 20, 50);
    doc.text(`Quality Level: ${currentSelection.quality}`, 20, 60);
    doc.text(`Walls: ${currentSelection.wall}${currentSelection.wallSub ? ' - '+currentSelection.wallSub : ''} - £${currentSelection.wallCost.toLocaleString()}`, 20, 70);
    doc.text(`Flooring: ${currentSelection.flooring} - £${currentSelection.flooringCost.toLocaleString()}`, 20, 80);
    doc.text(`Doors: ${currentSelection.doors} - £${currentSelection.doorsCost.toLocaleString()}`, 20, 90);
    doc.text(`Windows: ${currentSelection.windows} - £${currentSelection.windowsCost.toLocaleString()}`, 20, 100);
    doc.text(`Total Estimate: £${currentSelection.total.toLocaleString()}`, 20, 110);
    doc.text("Disclaimer: Prices are estimates only and may vary based on location, materials, and labour.", 20, 125, {maxWidth:170});

    doc.save(`Refurbish_Estimate_${currentSelection.room}.pdf`);
  }

  // Initialize wall sub-options
  updateWallSubOptions();
</script>

</body>
</html>
