<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Refurbish Price UK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1 class="title">Refurbish Price UK</h1>
  <p class="subtitle">Material & labour estimates for UK homes</p>

  <label>Room</label>
  <select id="room">
    <option>Bathroom</option>
    <option>Kitchen</option>
    <option>Bedroom</option>
    <option>Living Room</option>
  </select>

  <label>Room size (m²)</label>
  <input type="number" id="size" placeholder="e.g. 20">

  <label>Material</label>
  <select id="material">
    <option value="tile">Tile floor</option>
    <option value="wood">Wood floor</option>
    <option value="laminate">Laminate floor</option>
    <option value="vinyl">Vinyl floor</option>
    <option value="paint">Paint walls</option>
    <option value="wallpaper">Wallpaper</option>
  </select>

  <button onclick="calculateEstimate()">Calculate Estimate</button>

  <div id="result"></div>

</div>

<script src="script.js"></script>
</body>
</html>
